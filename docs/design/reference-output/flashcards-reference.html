<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flashcard faces · reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&amp;family=Vazirmatn:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#faf7f2;--card:#fff;--ink:#1f2328;--mute:#6b6f76;--line:#e8e1d6;--acc:#8a3b12;--on-acc:#fff;--acc2:#1f5f5b;--bad:#a1271b;--good:#1f6b3a;--hl:#fff3d6}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e9e6e1;--mute:#9a9ea5;--line:#30343a;--acc:#e7955d;--on-acc:#1f2226;--acc2:#6fc2bb;--bad:#ef8a7e;--good:#7fd09a;--hl:#3a321f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9;font-size:16px}
main{max-width:880px;margin:auto;padding:1rem 16px 4rem}
h1{font-size:1.5rem;margin:.5rem 0 0}
h1+p{color:var(--mute);margin:.2rem 0}
h2{font-size:1.05rem;color:var(--acc);margin:2rem 0 .6rem}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;align-items:start}
figure{margin:0}
figcaption{font-size:.8rem;color:var(--mute);margin-bottom:.3rem}

/* the four .fc-face rules below are the whole face style; everything else on this page is scaffolding */
.fc-face{font-family:Vazirmatn,Tahoma,sans-serif;font-size:20px;line-height:1.7;text-align:center}
.fc-face [dir=ltr]{font-family:Lora,Georgia,Vazirmatn,Tahoma,serif}
.fc-face .ipa{font-family:"Noto Serif","Charis SIL","Gentium Plus","Times New Roman","DejaVu Serif",serif}
.fc-face hr{border:0;border-top:1px solid currentColor;opacity:.15;margin:1em 0}
.fc-face{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.4rem 1.1rem}
</style>
</head>
<body>
<main>
<h1>فلش‌کارت‌ها — نمای روی کارت و پشت کارت</h1>
<p>محتوای هر کادر دقیقاً همان HTML فیلدهای Front و Back است که در فایل Anki هم می‌رود.</p>

<h2>۱. کارت production (با تله‌ی تلفظ)</h2>
<div class="pair">
<figure><figcaption>روی کارت</figcaption><div class="fc-face"><div dir="rtl" style="font-size:1.1em">استهلاک؛ ساییدگی و فرسودگی ناشی از استفاده</div><br><div dir="ltr">My paragliding kit is showing a bit of <b>______</b> after three seasons.</div></div></figure>
<figure><figcaption>پشت کارت (بعد از نمایش جواب)</figcaption><div class="fc-face"><div dir="rtl" style="font-size:1.1em">استهلاک؛ ساییدگی و فرسودگی ناشی از استفاده</div><br><div dir="ltr">My paragliding kit is showing a bit of <b>______</b> after three seasons.</div><hr><div dir="ltr"><b style="font-size:1.25em">wear and tear</b><br><span class="ipa">/ˌweər ən ˈteə/</span><br><br><i>My paragliding kit is showing a bit of wear and tear after three seasons.</i><br><br><b>Collocations:</b> normal/general wear and tear · show signs of wear and tear · the warranty doesn't cover wear and tear</div><br><div dir="rtl">🔊 وِئِر اِن تِئِ — ⚠️ تله‌ی بزرگ: <bdi>tear</bdi> اینجا با <bdi>wear</bdi> هم‌قافیه است <bdi class="ipa">/teə/</bdi> (پاره شدن) — نه <bdi class="ipa">/tɪə/</bdi> (اشک).<br>📝 غیرقابل‌شمارش: «<bdi>a wear and tear</bdi>» غلط است. در قرارداد اجاره و گارانتی زیاد می‌بینی.<br>🖼️ بالِ پاراگلایدرت که لبه‌اش ساییده و کمی «پاره» (<bdi>tear</bdi>) شده.</div></div></figure>
</div>

<h2>۲. کارت production (دو جای خالی، بدون تله)</h2>
<div class="pair">
<figure><figcaption>روی کارت</figcaption><div class="fc-face"><div dir="rtl" style="font-size:1.1em">تجهیز کردنِ جایی یا کسی با همه‌ی وسایل لازم</div><br><div dir="ltr">We've just moved into a new office, so we need to <b>______</b> it <b>______</b>.</div></div></figure>
<figure><figcaption>پشت کارت (بعد از نمایش جواب)</figcaption><div class="fc-face"><div dir="rtl" style="font-size:1.1em">تجهیز کردنِ جایی یا کسی با همه‌ی وسایل لازم</div><br><div dir="ltr">We've just moved into a new office, so we need to <b>______</b> it <b>______</b>.</div><hr><div dir="ltr"><b style="font-size:1.25em">kit sth out / kit sth out with</b><br><span class="ipa">/ˌkɪt ... ˈaʊt/</span><br><br><i>We've just moved into a new office, so we need to kit it out.</i><br><br><b>Collocations:</b> kit out the kitchen / kit the kitchen out · be kitted out with/in · (n) football kit, kit bag, paragliding kit</div><br><div dir="rtl">🔊 کیت ... آوت<br>📝 جداشدنی است: با اسم هر دو ترتیب درست است (<bdi>kit out the kitchen / kit the kitchen out</bdi>)، ولی با ضمیر فقط وسط: <bdi>kit it out</bdi> — هرگز «<bdi>kit out it</bdi>». اسمش <bdi>kit</bdi> = تجهیزات/لباس ورزشی.<br>🖼️ یک <bdi>kit bag</bdi> بزرگ که آن را خالی می‌کنی و یک آشپزخانه‌ی خالی پر از وسیله می‌شود.</div></div></figure>
</div>

<h2>۳. کارت production از نوع grammar</h2>
<div class="pair">
<figure><figcaption>روی کارت</figcaption><div class="fc-face"><div dir="rtl" style="font-size:1.1em">جمله را با ضمیر <bdi>it</bdi> بازنویسی کن:</div><br><div dir="ltr">We need to kit out the new office.</div></div></figure>
<figure><figcaption>پشت کارت (بعد از نمایش جواب)</figcaption><div class="fc-face"><div dir="rtl" style="font-size:1.1em">جمله را با ضمیر <bdi>it</bdi> بازنویسی کن:</div><br><div dir="ltr">We need to kit out the new office.</div><hr><div dir="ltr"><b style="font-size:1.25em">We need to kit it out.</b></div><br><div dir="rtl">📝 با ضمیر، مفعول همیشه وسطِ <bdi>phrasal verb</bdi> جداشدنی می‌آید: <bdi>kit it out</bdi> — نه «<bdi>kit out it</bdi>».</div></div></figure>
</div>

<h2>۴. کارت recognition (دسته‌ی تکمیلی)</h2>
<div class="pair">
<figure><figcaption>روی کارت</figcaption><div class="fc-face"><div dir="ltr"><b>you can't fault sb/sth</b><br><br><i>You can't fault the museum — every exhibition is worth going to.</i></div></div></figure>
<figure><figcaption>پشت کارت (بعد از نمایش جواب)</figcaption><div class="fc-face"><div dir="ltr"><b>you can't fault sb/sth</b><br><br><i>You can't fault the museum — every exhibition is worth going to.</i></div><hr><div dir="rtl" style="font-size:1.1em">هیچ ایرادی نمی‌شود به … گرفت</div><br><div dir="ltr"><span class="ipa">/fɔːlt/</span></div><br><div dir="rtl">📝 معلم: <bdi>You can't fault the teaching.</bdi></div></div></figure>
</div>
</main>
</body>
</html>
