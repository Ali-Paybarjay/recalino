            <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px"><p style="margin:0;font-size:34px;font-weight:500">recently</p></div>
            <div style="display:flex;gap:8px;align-items:center"><button class="btn btn-secondary btn-icon" aria-label="Play word" style="border-radius:50%"><i class="ph-fill ph-play"></i></button><span style="display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:5px;font-size:12px;background:var(--rc-info-tint);color:var(--rc-info);border:1px solid var(--rc-info-border)"><i class="ph ph-robot"></i>Computer voice</span></div>
          </div>
          <button class="btn btn-primary" style="width:100%;min-height:60px;font-size:17px">Show answer</button>
        </div>
      </div>
      <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.5;color:var(--rc-text-muted);display:flex;flex-direction:column;gap:4px">
        <li>The learner can continue; the unsaved answer shows as a striped segment in progress, and in words above.</li>
        <li>States: "Saving…" (quiet, after 1 s) → "Not saved yet — retrying" → disappears only on server confirm. If "End for now" is tapped while unsaved, the summary says "1 answer is still saving".</li>
        <li>Computer-generated audio is labelled "Computer voice", distinct from class audio chips.</li>
      </ul>
    </figure>
  </div>

  <figure id="F2-desktop" style="margin:0;display:flex;flex-direction:column;gap:14px;width:1440px">
    <div style="display:flex;gap:8px;align-items:center"><span class="tag tag-accent">F2</span><span style="font-weight:500">Desktop — answer shown, keyboard hints</span></div>
    <div style="width:1440px;height:900px;border-radius:14px;overflow:hidden;background:var(--color-bg);box-shadow:var(--shadow-md);display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:20px;padding:20px 40px"><button class="btn btn-ghost" style="font-size:15px"><i class="ph ph-x"></i>End for now</button><div style="flex:1;max-width:720px;height:6px;border-radius:3px;background:var(--rc-surface-2);display:flex;overflow:hidden"><span style="width:23%;background:var(--color-accent)"></span></div><span class="rc-num" style="font-size:14px;color:var(--rc-text-muted)">4 of 17 · about 11 min left</span></div>
      <div style="flex:1;display:flex;flex-direction:column;padding:32px 0 48px 200px;gap:24px;width:960px">
        <div style="display:flex;flex-direction:column;gap:22px;padding:40px;border-radius:16px;background:var(--color-surface);box-shadow:var(--shadow-sm);min-height:460px">
          <div style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--rc-text-muted)"><span>Cloze</span><span>·</span><span>Present perfect vs past simple</span></div>
          <p style="margin:0;font-size:34px;line-height:1.4">I've <b style="font-weight:500;color:var(--color-accent);border-bottom:2px solid var(--color-accent)">already</b> finished my homework.</p>
          <div style="height:1px;background:var(--color-divider)"></div>
          <div style="display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:8px;background:var(--rc-prov-ai-tint);border:1px solid var(--rc-prov-ai-border);max-width:640px">
            <span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--rc-prov-ai)"><i class="ph ph-lightbulb"></i>AI explanation</span>
            <p dir="rtl" lang="fa" style="margin:0;font-size:18px;line-height:1.8;text-align:right">already یعنی «قبلاً» یا «تا حالا»؛ وقتی کاری زودتر از انتظار انجام شده است.</p>
          </div>
          <div style="flex:1"></div>
          <div style="display:flex;gap:8px;align-items:center"><span style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;border:1px dashed var(--rc-border-strong);font-size:13px;color:var(--rc-text-muted)"><i class="ph ph-device-mobile-slash"></i>Class audio · 18:42 · not on this device</span><span style="flex:1"></span><button class="btn btn-ghost"><i class="ph ph-dots-three"></i>Card actions</button></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <button class="btn btn-secondary" style="min-height:60px;font-size:17px"><i class="ph ph-arrow-counter-clockwise"></i>Forgot<kbd style="margin-left:10px;font-family:var(--font-mono);font-size:12px;padding:2px 6px;border-radius:4px;border:1px solid var(--color-divider);color:var(--rc-text-muted)">1</kbd></button>
          <button class="btn btn-primary" style="min-height:60px;font-size:17px"><i class="ph ph-check"></i>Remembered<kbd style="margin-left:10px;font-family:var(--font-mono);font-size:12px;padding:2px 6px;border-radius:4px;border:1px solid var(--color-divider);color:var(--rc-text-muted)">2</kbd></button>
        </div>
      </div>
    </div>
    <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.5;color:var(--rc-text-muted);display:flex;flex-direction:column;gap:4px;max-width:900px">
      <li>Left-aligned, asymmetric (Nocturne). Card width ~760px for 30–34px card text.</li>
    </ul>
  </figure>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
