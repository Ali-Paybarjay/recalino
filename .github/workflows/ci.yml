name: CI

# Runs on every push; pull requests show the checks of their head commit.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, types, boundaries, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm test:unit

      - name: Start local Supabase (Postgres and Auth only)
        run: pnpm db:start
      - name: Generated DB types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code -- packages/core/src/db/types.ts
      - run: pnpm test:int

      - run: pnpm build
      - name: No secrets in the client-visible build (FR-PLT-009)
        run: pnpm check:client-bundle

  # Main and implementation branches; docs branches skip it to save minutes.
  e2e:
    name: End-to-end (main and implementation branches)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/codex/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Serves the /dev UI test pages that the accessibility and component tests use.
      RECALINO_DEV_UI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @recalino/web exec playwright install --with-deps chromium
      # Sign-in, setup and Settings need local Auth and Postgres (M3).
      - name: Start local Supabase (Postgres and Auth only)
        run: pnpm db:start
      - name: Write the local server configuration
        run: pnpm db:env
      - run: pnpm build
      - run: pnpm test:e2e
