name: CI

# Low-cost CI policy (owner decision, 2026-10-13; docs/ops/CI_LOW_COST_POLICY.md).
# The account's free Actions minutes are shared by every repository, so CI runs
# only where it gates a change:
#   push to main          → verify + e2e
#   pull request to main  → verify on open/synchronize/reopen; e2e only when the
#                           PR carries the `e2e` label
#   workflow_dispatch     → verify + e2e on any branch, on demand
# Plain pushes to feature or integration branches run nothing; run `pnpm verify`
# (and `pnpm test:e2e` when the change touches the UI) locally instead.
# Documentation-only changes skip CI entirely (paths-ignore below); docs/legal and
# docs/design stay in because tests read them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/plans/**"
      - "docs/adr/**"
      - "docs/fr/**"
      - "docs/ops/**"
      - "docs/*.md"
      - "artifacts/**"
      - "*.md"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/plans/**"
      - "docs/adr/**"
      - "docs/fr/**"
      - "docs/ops/**"
      - "docs/*.md"
      - "artifacts/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (a new push cancels the previous run) and one per branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, types, boundaries, tests, build
    # A `labeled` event starts a run only for the `e2e` label.
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm test:unit
      - name: Cloud Google readiness guard tests (no external calls)
        run: node --test tools/auth/check-google.test.mjs

      - name: Start local Supabase (Postgres and Auth only)
        run: pnpm db:start
      - name: Generated DB types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code -- packages/core/src/db/types.ts
      - run: pnpm test:int

      - run: pnpm build
      - name: No secrets in the client-visible build (FR-PLT-009)
        run: pnpm check:client-bundle
      # OPS-10 (D84): the e2e job starts this build instead of running `pnpm build` again. Kept
      # only when the e2e job will run (same condition as that job) and for one day.
      - name: Keep the build for the end-to-end job
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-build
          # .next is a hidden folder; the build cache stays out.
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Main, manual runs, and pull requests labeled `e2e` (about 20 minutes per run).
  e2e:
    name: End-to-end (main, manual runs, PRs labeled e2e)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Serves the /dev UI test pages that the accessibility and component tests use.
      RECALINO_DEV_UI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @recalino/web exec playwright install --with-deps chromium
      # Sign-in, setup and Settings need local Auth and Postgres (M3).
      - name: Start local Supabase (Postgres and Auth only)
        run: pnpm db:start
      - name: Write the local server configuration
        run: pnpm db:env
      # OPS-10 (D84): the same commit's build from the verify job; server settings are read when
      # the server starts, so the build does not need this job's local configuration.
      - name: Use the verify job's build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build
          path: apps/web/.next
      - run: pnpm test:e2e
