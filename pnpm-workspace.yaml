packages:
  - "apps/*"
  - "packages/*"

# Dependency build scripts are denied unless listed here (pnpm 12 default).
allowBuilds:
  # Downloads the pinned Supabase CLI binary used by the db:* scripts.
  supabase: true
  # SPIKE-05 only (M4, T5): downloads a static ffmpeg for the platform. Removed with the spike.
  ffmpeg-static: true
  # Pinned tsx operator runtime uses esbuild's platform binary.
  esbuild: true

# Release cooldown (OPS-12): a package version published less than 24 hours (1440 minutes) ago is
# not selected. pnpm 12 applies 1440 minutes without this key, but not strictly; the explicit value
# makes the policy visible and strict (an immature version is refused, not silently added to the
# exclude list). The exclude list below exempts only those exact versions, never a whole package.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.15'
  - '@biomejs/cli-darwin-arm64@2.5.15'
  - '@biomejs/cli-darwin-x64@2.5.15'
  - '@biomejs/cli-linux-arm64-musl@2.5.15'
  - '@biomejs/cli-linux-arm64@2.5.15'
  - '@biomejs/cli-linux-x64-musl@2.5.15'
  - '@biomejs/cli-linux-x64@2.5.15'
  - '@biomejs/cli-win32-arm64@2.5.15'
  - '@biomejs/cli-win32-x64@2.5.15'
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - vitest@5.0.3
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
  - pdfjs-dist@6.4.299
  - nodemailer@10.0.15

# Record exact versions in package.json (PROJECT_SPEC §3).
saveExact: true

# A dependency whose `engines` rules out the running Node.js fails the install instead of warning.
# The repository's own Node range (>=24 <25) is in package.json `engines` and .nvmrc; pnpm does not
# enforce a workspace's own `engines.node`.
engineStrict: true
