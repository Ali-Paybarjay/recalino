packages:
  - "apps/*"
  - "packages/*"

# Dependency build scripts are denied unless listed here (pnpm 12 default).
allowBuilds:
  # Downloads the pinned Supabase CLI binary used by the db:* scripts.
  supabase: true

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.15'
  - '@biomejs/cli-darwin-arm64@2.5.15'
  - '@biomejs/cli-darwin-x64@2.5.15'
  - '@biomejs/cli-linux-arm64-musl@2.5.15'
  - '@biomejs/cli-linux-arm64@2.5.15'
  - '@biomejs/cli-linux-x64-musl@2.5.15'
  - '@biomejs/cli-linux-x64@2.5.15'
  - '@biomejs/cli-win32-arm64@2.5.15'
  - '@biomejs/cli-win32-x64@2.5.15'
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - vitest@5.0.3

# Record exact versions in package.json (PROJECT_SPEC §3).
saveExact: true
